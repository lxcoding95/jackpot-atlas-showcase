name: Bug report
description: Report a reproducible issue in the public showcase.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private lottery data, credentials, local paths, or personal information. Use SECURITY.md for vulnerabilities.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
