name: Governance drift
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '7 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Verify repository controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check settings and ruleset
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/check_governance.py
