name: Automation incident tracker
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
concurrency:
  group: incidents-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  reconcile:
    name: Reconcile default-branch incidents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # Reads workflow run status for incident reconciliation
      # Needed to open, refresh, and close incident issues; never edits repository controls.
      issues: write # Opens and reconciles incidents; cannot edit repository controls
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reconcile latest default-branch automation runs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/scan_recent_runs.py
